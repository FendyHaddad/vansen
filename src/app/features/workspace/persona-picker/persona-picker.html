@if (locked()) {
  <button type="button" class="pp-tile persona-locked" title="Personas — Studio plan" (click)="manage()">
    Persona
  </button>
} @else if (current(); as persona) {
  <button type="button" class="pp-chip" [hlmDropdownMenuTrigger]="personaMenu" align="start">
    <img [src]="persona.thumbUrl" [alt]="persona.name" class="pp-chip-thumb"/>
    <span class="pp-chip-name">{{ persona.name }}</span>
    <ng-icon name="lucideChevronDown" size="13" class="pp-chip-chevron"/>
  </button>
} @else {
  <button
    type="button"
    class="pp-tile"
    title="Generate with your saved likeness"
    [hlmDropdownMenuTrigger]="personaMenu"
    align="start"
  >
    Persona
  </button>
}

<ng-template #personaMenu>
  <div hlmDropdownMenu class="persona-menu">
    <button
      type="button"
      hlmDropdownMenuItem
      class="persona-row"
      [class.persona-row-active]="!selected()"
      (triggered)="select(null)"
    >
      <span class="persona-row-blank"><ng-icon name="lucideUserRound" size="16"/></span>
      <span class="persona-row-name">None</span>
    </button>
    @for (persona of personas(); track persona.id) {
      <button
        type="button"
        hlmDropdownMenuItem
        class="persona-row"
        [class.persona-row-active]="selected() === persona.id"
        [disabled]="persona.status !== statuses.Ready"
        (triggered)="persona.status === statuses.Ready && select(persona.id)"
      >
        @if (persona.thumbUrl) {
          <img [src]="persona.thumbUrl" [alt]="persona.name" class="persona-row-thumb"/>
        } @else {
          <span class="persona-row-blank"><ng-icon name="lucideUserRound" size="16"/></span>
        }
        <span class="persona-row-name">{{ persona.name }}</span>
        @if (persona.status === statuses.Draft) {
          <span class="persona-row-status">Draft</span>
        }
      </button>
    }
    <button type="button" hlmDropdownMenuItem class="persona-row persona-row-manage" (triggered)="manage()">
      <span class="persona-row-name">Manage personas…</span>
    </button>
  </div>
</ng-template>
