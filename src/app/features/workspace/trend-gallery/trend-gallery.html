<div class="tc">
  <div class="tc-frame" [class.tc-frame--start]="atStart()" [class.tc-frame--end]="atEnd()">
    <div #track class="tc-track" role="group" aria-label="Trends" (scroll)="onScroll()">
      @for (trend of trends; track trend.id) {
        <button
          type="button"
          class="tc-tile"
          [class.tc-tile--on]="selected() === trend.id"
          [attr.aria-pressed]="selected() === trend.id"
          [attr.aria-label]="trend.name"
          (click)="pick(trend)"
        >
          @if (missing().has(trend.id)) {
            <span class="tc-fallback"></span>
          } @else {
            <img
              [src]="trend.thumb"
              alt=""
              loading="lazy"
              draggable="false"
              (error)="markMissing(trend.id)"
            />
          }
          <span class="tc-name">{{ trend.name }}</span>
        </button>
      }
    </div>

    @if (!atStart()) {
      <button type="button" class="tc-arrow tc-arrow--prev" aria-label="Previous trends" (click)="page(-1)">
        <ng-icon name="lucideChevronLeft" size="14"/>
      </button>
    }
    @if (!atEnd()) {
      <button type="button" class="tc-arrow tc-arrow--next" aria-label="More trends" (click)="page(1)">
        <ng-icon name="lucideChevronRight" size="14"/>
      </button>
    }
  </div>
</div>
